<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slider">
    <div class="slides">

      <div class="slide">
        <img src="https://picsum.photos/id/1015/900/500" alt="">
      </div>

      <div class="slide">
        <img src="https://picsum.photos/id/1016/900/500" alt="">
      </div>

      <div class="slide">
        <img src="https://picsum.photos/id/1018/900/500" alt="">
      </div>

    </div>

    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>

    <div class="dots"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
